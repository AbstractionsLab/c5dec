# Enhanced C5-DEC Configuration (v2)
# This version supports clean YAML format for changelog entries
# No manual LaTeX required!

# do not update application-date, it is read from _quarto.yml to ensure consistency across formats
cover:
  company: "itrust Abstractions Lab (ALab)"
  project: "C5-DEC CAD"
  type: "Report (REP)"
  reference: "3D3M"
  version: "1.0"
  state: "Final"
  owner: "ALab"
  authors: "C5-DEC team"
  application-date: <_quarto.yml date>
  classification: "TLP:CLEAR"
  bottom-text: "Generated by C5-DEC CAD DocEngine."

# do not update activity and title, they are read from _quarto.yml to ensure consistency across formats
meta:
  fullname: "C5DEC-EndUserManual"
  activity: <_quarto.yml subtitle>
  title: <_quarto.yml title>
  type: "REP"
  
  # Enhanced changelog format - multiple options available:
  changelog:
    - ["1.0", "23/03/2026", "C5-DEC team",
       {"description": "Summary of first release:",
        "items": ["Created consolidated end-user manual structure from docs/manual content",
                  "Added workflow-oriented navigation and quick command reference",
                  "Integrated manual screenshots into a self-contained DocEngine report project"]}]
  
  # Approval table remains unchanged
  approval:
    [
      ["Arash", "CTO", "Product owner", "---"],
      ["Arash", "CTO", "Technical writer", "---"],
      ["Itzel", "RD Scientist", "Technical writer", "---"]
    ]
