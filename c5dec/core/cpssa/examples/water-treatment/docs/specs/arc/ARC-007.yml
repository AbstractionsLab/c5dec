header: PLC Chemical Dosing
type: plc
zone: OT
text: |
  Siemens S7-1500 PLC managing chlorine and coagulant dosing pumps.
  Receives setpoints from SCADA via OPC-UA; independently executes safety
  interlocks if communication is lost.  Controls six 4–20 mA analogue outputs
  driving chemical metering pumps.  Compromise can lead to over/under-dosing
  with direct public health consequences.
