text: |
  Central SCADA server orchestrating process control logic, setpoint distribution,
  alarm aggregation, and PI data feed.  Runs iFIX SCADA with redundant hot-standby.
  Authenticated OPC-UA connections to all PLCs and RTUs; read-only DCOM feed
  to the historian.  This server is the primary lateral movement pivot between
  the SCADA zone and the OT field bus network.
