header: RTU Sensor Gateway
type: rtu
zone: OT
text: |
  Moxa RTU gateway aggregating analogue and digital field sensors:
  turbidity probes (nephelometric), pressure transmitters, level ultrasonic
  sensors, and flow meters. Converts 4–20 mA / HART signals to Modbus TCP
  for forwarding to both PLCs and SCADA. Spoofed sensor readings can mask
  physical process anomalies or trigger false safety shutdowns.
