# Enhanced C5-DEC Configuration (v2)
# This version supports clean YAML format for changelog entries
# No manual LaTeX required!

# do not update application-date, it is read from _quarto.yml to ensure consistency across formats
cover:
  company: "itrust Abstractions Lab"
  project: "CyFORT"
  type: "Report (REP)"
  reference: "3C0A0"
  version: "1.0"
  state: "Draft"
  owner: "Shafi"
  authors: "Dijkstra"
  application-date: <_quarto.yml date>
  classification: "Restricted"
  bottom-text: "Generated by C5-DEC CAD DocEngine; sources in ALab GitLab."

# do not update activity and title, they are read from _quarto.yml to ensure consistency across formats
meta:
  fullname: "C5DEC-DocEngineReportTemplate"
  activity: <_quarto.yml subtitle>
  title: <_quarto.yml title>
  type: "REP"
  
  # Enhanced changelog format - multiple options available:
  changelog:
    # Example 1: List of changes (for multiple changes per version)
    - ["1.2", "14/05/2025", "Arash Atashpendar",
       ["Some more change 1",
        "Some more change 2"]]
    
    - ["1.0", "04/07/2024", "Ada",
       ["Change 1",
        "Change 2",
        "Change 3",
        "Change 4",
        "Change 5",
        "Change 6",
        "Change 7",
        "Change 8",
        "Replaced inline hyperlinks with footnotes",
        "Further minor revisions throughout"]]
    
    # Example 2: Simple string (for single-item changelog)
    - ["0.1", "03/07/2024", "Alan", "First draft"]
  
  # Approval table remains unchanged
  approval:
    [
      ["Grace", "CTO", "Content agreement", "---"],
      ["Knuth", "RD Scientist", "Content agreement", "---"],
      ["Babbage", "RD Specialist", "Content agreement", "---"]
    ]
